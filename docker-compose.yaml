volumes:
  dbdata:

services:

  www:
    build: .
    ports:
      - "127.0.0.1:3002:3001"
    restart: always

  db:
    image: mongo:8.0.17
    restart: always
    volumes:
      - type: volume
        source: dbdata
        target: /data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: bctool
      MONGO_INITDB_ROOT_PASSWORD: phev
